<title>Прототип Кассы</title>
<style>
/* Раскладка: слева панель прототипа, справа сцена (рамка iPhone или Web). Liquid glass, чёрно-белая. */
:root{
  --bg1:#F7F8F9;
  --bg-grad: radial-gradient(120% 55% at 50% -12%, rgba(255,255,255,.95), rgba(255,255,255,0) 62%), linear-gradient(180deg,#F7F8F9,#E5E7EB);
  --card: rgba(255,255,255,.86); --card-bd: rgba(255,255,255,1); --card-hl: rgba(255,255,255,.9);
  --shadow: 0 12px 30px rgba(20,22,30,.08); --shadow-s: 0 4px 14px rgba(20,22,30,.07);
  --fg:#0E0F12; --fg2:#6B6E76; --fg3:#A0A3AA;
  --accent:#0E0F12; --on-accent:#FFFFFF; --btn-hl: rgba(255,255,255,.22); --shine: rgba(255,255,255,.38);
  --sep: rgba(14,15,18,.075); --fill: rgba(14,15,18,.045); --fill-2: rgba(14,15,18,.085); --fill-bd: rgba(14,15,18,.07);
  --avatar:#E7E8EB; --avatar-fg:#4A4D55;
  --green:#1E8A4C; --green-bg: rgba(30,138,76,.09);
  --red:#D0362C; --red-bg: rgba(208,54,44,.08);
  --amber:#B0650A; --amber-bg: rgba(214,138,20,.12);
  --tabbar: rgba(255,255,255,.84); --tab-shadow: 0 12px 32px rgba(20,22,30,.14), 0 2px 6px rgba(20,22,30,.06);
  --lens: linear-gradient(180deg,#FFFFFF,#F1F2F4); --lens-hl: #FFFFFF; --lens-shadow: 0 3px 9px rgba(20,22,30,.13);
  --sheet: rgba(248,249,250,.95); --scrim: rgba(14,15,18,.26);
  --tg-pill: rgba(255,255,255,.72); --fade-top: rgba(247,248,249,.94);
  --skel: rgba(14,15,18,.06); --skel-hl: rgba(255,255,255,.75);
  --device:#101113; --device-edge:#2B2D31; --ring:#0E0F12;
  --panel: rgba(255,255,255,.66);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg1:#15171B;
  --bg-grad: radial-gradient(100% 50% at 50% -12%, rgba(255,255,255,.06), rgba(255,255,255,0) 60%), linear-gradient(135deg,#1D1F23 0%,#0E0F12 55%,#15171B 100%);
  --card: rgba(255,255,255,.045); --card-bd: rgba(255,255,255,.09); --card-hl: rgba(255,255,255,.12);
  --shadow: 0 12px 30px rgba(0,0,0,.34); --shadow-s: 0 4px 14px rgba(0,0,0,.3);
  --fg:#F2F3F5; --fg2:#8E9198; --fg3:#5F6269;
  --accent:#FFFFFF; --on-accent:#0E0F12; --btn-hl: rgba(255,255,255,.5); --shine: rgba(14,15,18,.14);
  --sep: rgba(255,255,255,.07); --fill: rgba(255,255,255,.06); --fill-2: rgba(255,255,255,.11); --fill-bd: rgba(255,255,255,.08);
  --avatar: rgba(255,255,255,.09); --avatar-fg:#C9CBD0;
  --green:#45D483; --green-bg: rgba(69,212,131,.12);
  --red:#FF6A5F; --red-bg: rgba(255,106,95,.12);
  --amber:#F2A93B; --amber-bg: rgba(242,169,59,.14);
  --tabbar: rgba(36,38,43,.86); --tab-shadow: 0 12px 32px rgba(0,0,0,.5);
  --lens: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.08)); --lens-hl: rgba(255,255,255,.22); --lens-shadow: 0 3px 9px rgba(0,0,0,.35);
  --sheet: rgba(26,28,32,.95); --scrim: rgba(0,0,0,.5);
  --tg-pill: rgba(44,46,51,.72); --fade-top: rgba(21,23,27,.94);
  --skel: rgba(255,255,255,.06); --skel-hl: rgba(255,255,255,.09);
  --ring:#FFFFFF; --panel: rgba(30,32,36,.66);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg1:#15171B;
  --bg-grad: radial-gradient(100% 50% at 50% -12%, rgba(255,255,255,.06), rgba(255,255,255,0) 60%), linear-gradient(135deg,#1D1F23 0%,#0E0F12 55%,#15171B 100%);
  --card: rgba(255,255,255,.045); --card-bd: rgba(255,255,255,.09); --card-hl: rgba(255,255,255,.12);
  --shadow: 0 12px 30px rgba(0,0,0,.34); --shadow-s: 0 4px 14px rgba(0,0,0,.3);
  --fg:#F2F3F5; --fg2:#8E9198; --fg3:#5F6269;
  --accent:#FFFFFF; --on-accent:#0E0F12; --btn-hl: rgba(255,255,255,.5); --shine: rgba(14,15,18,.14);
  --sep: rgba(255,255,255,.07); --fill: rgba(255,255,255,.06); --fill-2: rgba(255,255,255,.11); --fill-bd: rgba(255,255,255,.08);
  --avatar: rgba(255,255,255,.09); --avatar-fg:#C9CBD0;
  --green:#45D483; --green-bg: rgba(69,212,131,.12);
  --red:#FF6A5F; --red-bg: rgba(255,106,95,.12);
  --amber:#F2A93B; --amber-bg: rgba(242,169,59,.14);
  --tabbar: rgba(36,38,43,.86); --tab-shadow: 0 12px 32px rgba(0,0,0,.5);
  --lens: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.08)); --lens-hl: rgba(255,255,255,.22); --lens-shadow: 0 3px 9px rgba(0,0,0,.35);
  --sheet: rgba(26,28,32,.95); --scrim: rgba(0,0,0,.5);
  --tg-pill: rgba(44,46,51,.72); --fade-top: rgba(21,23,27,.94);
  --skel: rgba(255,255,255,.06); --skel-hl: rgba(255,255,255,.09);
  --ring:#FFFFFF; --panel: rgba(30,32,36,.66);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg1);background-image:var(--bg-grad);background-attachment:fixed;color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:12px}
.num,.m{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.m{white-space:nowrap}
.m .cur{font-size:.72em;color:var(--fg2);margin-left:.22em;font-weight:500}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)}
.pos .cur,.neg .cur{color:inherit;opacity:.7}

/* ---------- shell ---------- */
.shell{display:flex;height:100%}
.proto{width:244px;flex:none;margin:16px 0 16px 16px;padding:16px;border-radius:26px;background:var(--panel);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--card-bd),var(--shadow);overflow:auto;display:flex;flex-direction:column;gap:14px;z-index:60}
.pr-head{display:flex;align-items:center;gap:10px}
.pr-head b{display:block;font-size:15px}
.pr-head small{display:block;color:var(--fg2);font-size:12px}
.pr-head .x{margin-left:auto;display:none}
.pr-g{display:flex;flex-direction:column;gap:6px}
.pr-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.pr-note{font-size:12px;color:var(--fg2);line-height:1.45;margin:0}
.pr-note code{font-family:ui-monospace,Menlo,monospace;background:var(--fill);padding:1px 6px;border-radius:6px}
.stage{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;container-type:inline-size;overflow:hidden}
.proto-fab{display:none;position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:70;width:40px;height:40px;border-radius:50%;background:var(--tg-pill);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow-s),inset 0 0 0 1px var(--fill-bd);place-items:center;color:var(--fg)}

/* ---------- device ---------- */
.device-wrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:414px;height:868px;border-radius:64px;background:var(--device);box-shadow:inset 0 0 0 2px var(--device-edge),0 30px 70px rgba(10,12,16,.28);padding:12px;transform-origin:0 0}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--bg1);background-image:var(--bg-grad);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:90}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 44px;z-index:85;font-weight:600;font-size:16px;color:var(--fg);pointer-events:none}
.sbar .sic{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:85;pointer-events:none}
.bare-mode .proto-fab{display:none!important}
.screen.bare{position:absolute;inset:0;width:auto;height:auto;border-radius:0;background:transparent}

/* ---------- app (phone) ---------- */
.app{position:absolute;inset:0;--safe-top:54px;--cs:46px;--safe-bot:22px}
.bare .app{--safe-top:max(8px,env(safe-area-inset-top,0px));--safe-bot:max(8px,env(safe-area-inset-bottom,0px))}
.tg-real .tg-top{display:none}
.sa-ov{position:absolute;left:0;right:0;z-index:80;pointer-events:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 2px;font:600 10px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.02em}
.sa-ov.safe{top:0;height:var(--safe-top);background:rgba(255,59,48,.16);box-shadow:inset 0 -1px 0 rgba(255,59,48,.7);color:#E5352B}
.sa-ov.cont{top:var(--safe-top);height:var(--cs);background:rgba(0,122,255,.13);box-shadow:inset 0 -1px 0 rgba(0,122,255,.7);color:#1D6FE0}
.sa-ov.bot{bottom:0;height:var(--safe-bot);align-items:flex-start;padding-top:2px;background:rgba(255,59,48,.16);box-shadow:inset 0 1px 0 rgba(255,59,48,.7);color:#E5352B}
.pr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.pages{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;background:transparent;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.page.from-right{transform:translateX(100%)}
.page.from-left{transform:translateX(-28%);opacity:.5}
.page.slide-in{transform:none;opacity:1}
.page.leaving{pointer-events:none}
.page.to-left{transform:translateX(-28%);opacity:.4}
.page.to-right{transform:translateX(100%)}
.page.drag{transition:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--safe-top) + var(--cs) + 4px) 16px calc(var(--safe-bot) + 104px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.app.has-q .scroll{padding-bottom:calc(var(--safe-bot) + 184px)}
.tg-fade{position:absolute;top:0;left:0;right:0;height:calc(var(--safe-top) + var(--cs) + 4px);background:linear-gradient(180deg,var(--fade-top) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);z-index:20;pointer-events:none}
.tb-fade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-bot) + 70px);background:linear-gradient(0deg,var(--fade-top) 35%,transparent);pointer-events:none;z-index:26}
.tg-ttl{position:absolute;top:calc(var(--safe-top) + 4px);left:50%;transform:translate(-50%,4px);height:34px;max-width:calc(100% - 236px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:24;pointer-events:none;opacity:0;transition:opacity .22s,transform .22s}
.tg-ttl.show{opacity:1;transform:translate(-50%,0)}
.tg-ttl b{font-size:15px;font-weight:650;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-ttl small{font-size:11px;color:var(--fg2);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-ttl{font-size:20px;font-weight:700;letter-spacing:-.01em;padding-left:4px;white-space:nowrap}
.cb{display:flex;flex-direction:column;margin:8px 0 6px;container-type:inline-size}
.cb-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0}
.cb-row+.cb-row{border-top:1px solid var(--sep)}
.cb-n{font-size:14px;color:var(--fg2);font-weight:550;flex:none}
.cb-v{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 16px;font-size:clamp(18px,6.6cqw,26px);font-weight:700;letter-spacing:-.02em}
.citypick{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 12px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--fill-bd);font-weight:600;font-size:13px;color:var(--fg)}
.bsep{width:1px;height:18px;background:var(--sep);flex:none}
.web .seg.scope{max-width:440px}
.tg-top{position:absolute;top:calc(var(--safe-top) + 4px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:25;pointer-events:none}
.tg-pill{pointer-events:auto;height:34px;border-radius:17px;background:var(--tg-pill);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 0 0 .5px var(--fill-bd);display:flex;align-items:center;font-weight:600;font-size:15px}
.tg-pill.l{padding:0 14px;gap:4px}
.tg-pill.r button{width:42px;height:34px;display:grid;place-items:center}
.tg-pill.r button+button{border-left:1px solid var(--sep)}

/* tab bar */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bot) + 8px);height:64px;border-radius:32px;background:var(--tabbar);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);box-shadow:var(--tab-shadow);display:flex;padding:5px;z-index:30;touch-action:none;user-select:none;-webkit-user-select:none}
.lens{position:absolute;top:5px;bottom:5px;left:0;border-radius:27px;background:var(--lens);box-shadow:inset 0 1px 0 var(--lens-hl),var(--lens-shadow);transition:transform .52s cubic-bezier(.34,1.45,.64,1),width .3s,scale .25s cubic-bezier(.34,1.56,.64,1);will-change:transform;z-index:0}
.lens.drag{transition:width .2s,scale .25s}
.tabbar.press .lens{scale:1.07}
.tab{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg2);font-size:10.5px;font-weight:600;letter-spacing:.01em;border-radius:27px;transition:color .2s}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tab.on{color:var(--fg)}

/* queue banner */
.qbar{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bot) + 80px);z-index:28;border-radius:22px;padding:12px 14px;background:var(--sheet);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow),inset 0 0 0 1px var(--fill-bd);max-height:52%;overflow:auto}
.qbar.amber{box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--amber) 45%,transparent)}
.qbar.red{box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--red) 45%,transparent)}
.qhead{display:flex;align-items:center;gap:10px}
.qdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.amber .qdot{background:var(--amber-bg);color:var(--amber)}
.red .qdot{background:var(--red-bg);color:var(--red)}
.qt{font-weight:650;font-size:14.5px}
.qs{font-size:12.5px;color:var(--fg2);margin-top:1px}
.qbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qlist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--fill);font-size:13.5px}
.qitem .grow{flex:1;min-width:0}
.qitem small{display:block;color:var(--fg2);font-size:12px}
.qhint{font-size:12px;color:var(--fg2);margin:8px 2px 0;line-height:1.4}

/* ---------- page header ---------- */
.ph{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.brand{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:750;font-size:19px;flex:none;box-shadow:inset 0 1px 0 var(--btn-hl)}
.ph .tt{flex:1;min-width:0}
.ph h1{margin:0;font-size:28px;line-height:1.1;font-weight:750;letter-spacing:-.02em;text-wrap:balance;overflow:hidden;text-overflow:ellipsis}
.ph p{margin:3px 0 0;color:var(--fg2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .acts{display:flex;gap:8px;flex:none}

/* add button */
.btn-add{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:15px;overflow:hidden;box-shadow:0 6px 16px rgba(10,12,16,.18),inset 0 1px 0 var(--btn-hl);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.btn-add:active{transform:scale(.9);transition-duration:.12s}
.btn-add .pl{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--on-accent) 20%,transparent);display:grid;place-items:center}
.btn-add::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,var(--btn-hl),transparent);pointer-events:none;opacity:.7}
.btn-add::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-70%;background:linear-gradient(100deg,transparent,var(--shine),transparent);transform:skewX(-18deg);animation:shine 5.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,72%{left:-70%}100%{left:135%}}

/* ---------- cards / lists ---------- */
.card{background:var(--card);border-radius:28px;box-shadow:inset 0 0 0 1px var(--card-bd),inset 0 1px 0 var(--card-hl),var(--shadow);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-t{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin:6px 4px -4px;display:flex;justify-content:space-between;gap:8px}
.sec-t span:last-child{text-transform:none;letter-spacing:0;font-weight:500}
.list{background:var(--card);border-radius:26px;box-shadow:inset 0 0 0 1px var(--card-bd),inset 0 1px 0 var(--card-hl),var(--shadow);overflow:hidden;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative;min-height:56px}
button.row:active,.row.tap:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--sep)}
.list.flat .row+.row::before{left:16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--avatar);color:var(--avatar-fg);display:grid;place-items:center;font-weight:650;font-size:13.5px;flex:none;letter-spacing:.01em}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.rt .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:600}
.rv .eq{font-size:11.5px;color:var(--fg2);font-weight:500}
.chev{color:var(--fg3)}
.del{opacity:.55}
.del .rv .m{text-decoration:line-through}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:650;background:var(--fill-2);color:var(--fg2);white-space:nowrap;flex:none}
.badge.g{background:var(--green-bg);color:var(--green)}
.badge.r{background:var(--red-bg);color:var(--red)}
.badge.a{background:var(--amber-bg);color:var(--amber)}
.badge.k{background:var(--accent);color:var(--on-accent)}

/* hero */
.hero{padding:18px 18px 16px;container-type:inline-size}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-l{color:var(--fg2);font-size:14px;font-weight:550}
.hero-n{font-size:clamp(28px,12.5cqw,46px);font-weight:720;letter-spacing:-.03em;margin:12px 0 4px;line-height:1.05}
.hero-n .cur{font-size:.5em;letter-spacing:0}
.hero-x{font-size:13px;color:var(--fg2);margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0}
.kv+.kv{border-top:1px solid var(--sep)}
.kv span:first-child{color:var(--fg2)}
.kv b{font-weight:600}
.kv.sub span:first-child{padding-left:14px;font-size:13px}
.kv.sub{font-size:13px;padding:4px 0}
.kv.sub+.kv.sub{border-top:0}

function totalsCalc(city,cur,from,to){
 const f=keyTs(from), t=keyTs(to)+DAY;
 const start=balOf(D(),city,cur,f-1);
 const ops=D().ops.filter(o=>!o.deleted&&o.city===city&&o.cur===cur&&o.ts>=f&&o.ts<t);
 const inc={},exp={};let I=0,X=0,O=0;
 ops.forEach(o=>{if(o.type==='in'){I+=o.amount;inc[o.cat]=(inc[o.cat]||0)+o.amount}else if(getCat(o.cat)&&getCat(o.cat).owner){O+=o.amount}else{X+=o.amount;exp[o.cat]=(exp[o.cat]||0)+o.amount}});
 let Df=0;D().recs.forEach(r=>{if(r.city===city&&r.ts>=f&&r.ts<t)r.rows.forEach(x=>{if(x.cur===cur)Df+=x.diff})});
 return{start,I,X,O,Df,end:start+I-X-O+Df,inc,exp};
}
P.totals=()=>{

 const f=keyTs(from),t=keyTs(to)+DAY;
 const ops=E(D().ops.filter(o=>!o.deleted&&vc.includes(o.city)&&o.ts>=f&&o.ts<t));
 let ui=0,ux=0,uo=0,nc=0;ops.forEach(o=>{const e=usdEq(o);if(e==null){nc+=o.amount;return}if(o.type==='in')ui+=e;else if(getCat(o.cat).owner)uo+=e;else ux+=e});
 const res=ui-ux;
 body+=`<section class="card hero"><div class="hero-top"><span class="hero-l">В долларах · ${both?'обе кассы':CITY[city]}</span><span class="badge">${dayLabel(from,false)} – ${dayLabel(to,false)}</span></div><div class="hero-n ${res<0?'neg':''}">${M(res,'USD',true)}</div><div class="hero-x">Приход минус расход, рублёвые записи по курсу</div><div class="kv"><span>Приход</span><b>${M(ui,'USD',false,'pos')}</b></div><div class="kv"><span>Расход</span><b>${M(-ux,'USD',true,'neg')}</b></div><div class="kv"><span>Передано владельцу</span><b>${M(uo,'USD')}</b></div>${nc?`<div class="kv"><span>Не в расчёте</span><b>${M(nc,'RUB')} <small style="color:var(--fg2);font-weight:500">в рублях без курса</small></b></div>`:''}</section>`;
 const data=vc.flatMap(ct=>curs(ct).map(c=>[c,totalsCalc(ct,c,from,to),ct]));
 const aggr=k=>['RUB','USD'].filter(c=>data.some(x=>x[0]===c)).map(c=>[c,data.filter(x=>x[0]===c).reduce((s,x)=>s+(k==='I'?x[1].I:x[1].X+x[1].O),0)]);
 body+=`<div class="grid2" style="margin-top:14px"><div class="card mini"><div class="t">Приход, записей</div><div class="n pos">${ops.filter(o=>o.type==='in').length}</div><hr>${aggr('I').map(([c,v])=>`<div class="kv"><span>${CUR_N[c]}</span><b>${M(v,c)}</b></div>`).join('')}</div><div class="card mini"><div class="t">Расход, записей</div><div class="n neg">${ops.filter(o=>o.type==='out').length}</div><hr>${aggr('X').map(([c,v])=>`<div class="kv"><span>${CUR_N[c]}</span><b>${M(v,c)}</b></div>`).join('')}</div></div>`;
 body+=`<div class="${S.ui.view==='web'?'grid':'stack'}" style="margin-top:14px">`+data.map(([c,d,ct])=>`<section class="card form-card" style="gap:0"><div class="hero-top" style="margin-bottom:6px"><b style="font-size:16px">${both?CITY[ct]+' · ':''}${CUR_N[c]}</b><span class="badge">${SYM[c]}</span></div>
 <div class="kv"><span>Остаток на начало</span><b>${M(d.start,c)}</b></div>
 <div class="kv"><span>Приход</span><b>${M(d.I,c,true,'pos')}</b></div>${Object.entries(d.inc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv sub"><span>${esc(catName(k))}</span><span>${M(v,c)}</span></div>`).join('')}
 <div class="kv"><span>Расход</span><b>${M(-d.X,c,true,'neg')}</b></div>${Object.entries(d.exp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv sub"><span>${esc(catName(k))}</span><span>${M(v,c)}</span></div>`).join('')}
 <div class="kv"><span>Передано владельцу</span><b>${M(-d.O,c,true)}</b></div>

function current(){const r=S.ui.route;return r.stack.length?r.stack[r.stack.length-1]:{p:r.tab}}
function ensureRoute(){const r=S.ui.route;if(!allowed(r.tab)||(S.ui.view==='phone'&&!tabs().includes(r.tab))){r.tab=tabs()[0];r.stack=[]}r.stack=r.stack.filter(x=>SEC[x.p]?allowed(x.p):true)}
function go(sec){const r=S.ui.route;if(S.ui.view==='phone'&&!tabs().includes(sec)){r.stack.push({p:sec});renderPage('push')}else{const same=r.tab===sec&&!r.stack.length;r.tab=sec;r.stack=[];renderPage(null);if(same){const sc=$('.page .scroll');sc&&sc.scrollTo({top:0,behavior:'smooth'})}}closeSide();save()}
function push(p,a){S.ui.route.stack.push({p,a});renderPage('push');save()}
function back(){const r=S.ui.route;if(!r.stack.length)return false;r.stack.pop();if(!r.stack.length)S.drafts=null;renderPage('pop');save();return true}

 if(S.ui.screen==='loading')pg.body=skelHTML(),pg.mount=null;
 return pg;

function pageInner(pg){
 const ph=S.ui.view==='phone';
 if(pg.compact)return `<div class="scroll"><div class="${pg.narrow&&!ph?'narrow':''}">${pg.body}</div></div>`;
 return `<div class="scroll"><div class="${pg.narrow&&!ph?'narrow':''}"><header class="ph">${pg.brand?`<span class="brand" aria-hidden="true">К</span>`:''}<div class="tt"><h1>${esc(pg.title)}</h1>${pg.sub?`<p>${esc(pg.sub)}</p>`:''}</div>${pg.action?`<div class="acts">${pg.action}</div>`:''}</header>${pg.body}</div></div>`;

function renderPage(dir){
 const host=$('#pages');if(!host)return;ensureRoute();
 const pg=buildPage(current());S.pgTitle={t:pg.title,s:pg.short||pg.sub||'',compact:!!pg.compact};
 const el=document.createElement('div');el.className='page';el.innerHTML=pageInner(pg);
 const old=host.querySelector('.page:not(.leaving)');
 if(dir&&old&&S.ui.view==='phone'&&!reduced()){
  if(dir==='push'){el.classList.add('from-right');host.appendChild(el);el.offsetWidth;el.classList.add('slide-in');old.classList.add('leaving','to-left')}
  else{el.classList.add('from-left');host.insertBefore(el,old);el.offsetWidth;el.classList.add('slide-in');old.style.transform='';old.classList.add('leaving','to-right')}
  setTimeout(()=>old.remove(),420);
 } else {host.innerHTML='';host.appendChild(el)}
 pg.mount&&pg.mount(el);
 updateChrome();
}

/* ---------- перетаскивание ---------- */
function sortable(list,onEnd){
 if(!list)return;
 list.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');if(!g)return;const item=g.closest('.srt-item');if(!item)return;
  e.preventDefault();const sc=scaleNow();let y0=e.clientY;item.classList.add('dragging');g.setPointerCapture(e.pointerId);
  const mv=ev=>{let dy=(ev.clientY-y0)/sc;const prev=item.previousElementSibling,next=item.nextElementSibling;
   if(prev&&dy<-prev.offsetHeight/2){list.insertBefore(item,prev);y0-=prev.offsetHeight*sc;dy=(ev.clientY-y0)/sc}
   else if(next&&dy>next.offsetHeight/2){list.insertBefore(next,item);y0+=next.offsetHeight*sc;dy=(ev.clientY-y0)/sc}
   item.style.transform=`translateY(${dy}px)`};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);item.classList.remove('dragging');item.style.transform='';onEnd($$('.srt-item',list).map(x=>x.dataset.id))};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
 });
}

/* ---------- линза нижней панели ---------- */
let lensDrag=null, suppressClick=false;
document.addEventListener('pointerdown',e=>{
 const tb=e.target.closest('#tabbar');if(!tb)return;const l=$('#lens');if(!l)return;
 const sc=scaleNow();const m=/translateX\(([-\d.]+)px\)/.exec(l.style.transform);
 lensDrag={x0:e.clientX,lx:m?+m[1]:0,moved:false,sc,tb,l,id:e.pointerId};tb.classList.add('press');
});
document.addEventListener('pointermove',e=>{
 if(!lensDrag||e.pointerId!==lensDrag.id)return;const d=lensDrag;const dx=(e.clientX-d.x0)/d.sc;
 if(!d.moved&&Math.abs(dx)>6){d.moved=true;d.l.classList.add('drag');try{d.tb.setPointerCapture(e.pointerId)}catch(_){}}
 if(d.moved){const max=d.tb.clientWidth-d.l.offsetWidth-5;const x=Math.max(5,Math.min(max,d.lx+dx));d.l.style.transform=`translateX(${x}px)`;const tabsEl=$$('.tab',d.tb);const c=x+d.l.offsetWidth/2;tabsEl.forEach(t=>t.classList.toggle('on',c>=t.offsetLeft&&c<t.offsetLeft+t.offsetWidth))}
});
function endLens(){
 if(!lensDrag)return;const d=lensDrag;lensDrag=null;d.tb.classList.remove('press');d.l.classList.remove('drag');
 if(d.moved){suppressClick=true;setTimeout(()=>suppressClick=false,60);const m=/translateX\(([-\d.]+)px\)/.exec(d.l.style.transform);const c=(m?+m[1]:0)+d.l.offsetWidth/2;const tabsEl=$$('.tab',d.tb);let i=tabsEl.findIndex(t=>c>=t.offsetLeft&&c<t.offsetLeft+t.offsetWidth);if(i<0)i=c<tabsEl[0].offsetLeft?0:tabsEl.length-1;const s=tabsEl[i].dataset.v;if(s===S.ui.route.tab&&!S.ui.route.stack.length)placeLens(i);else go(s)}
}
document.addEventListener('pointerup',endLens);document.addEventListener('pointercancel',endLens);

/* ---------- свайп назад от края ---------- */
let swipe=null;
document.addEventListener('pointerdown',e=>{
 if(S.ui.view!=='phone'||!S.ui.route.stack.length)return;const pages=e.target.closest('#pages');if(!pages)return;
 const r=pages.getBoundingClientRect();if(e.clientX-r.left>22*scaleNow())return;
 const pg=pages.querySelector('.page:not(.leaving)');if(!pg)return;swipe={x0:e.clientX,pg,sc:scaleNow(),dx:0,id:e.pointerId};pg.classList.add('drag');
});
document.addEventListener('pointermove',e=>{if(!swipe||e.pointerId!==swipe.id)return;swipe.dx=Math.max(0,(e.clientX-swipe.x0)/swipe.sc);swipe.pg.style.transform=`translateX(${swipe.dx}px)`});
function endSwipe(){if(!swipe)return;const s=swipe;swipe=null;s.pg.classList.remove('drag');if(s.dx>90){suppressClick=true;setTimeout(()=>suppressClick=false,60);back()}else s.pg.style.transform=''}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);

/* ---------- привязки полей ---------- */
document.addEventListener('input',e=>{
 const el=e.target, b=el.dataset&&el.dataset.bind;
 if(el.id==='pRole'){switchUser(el.value);return}
 if(el.id==='pScreen'){S.ui.screen=el.value;if(el.value!=='login')S.ui.logged=true;save();renderApp();return}
 if(!b)return;const [root,a,k]=b.split('.');
 if(root==='f'){const f=S.ui.forms[a];f[k]=el.value;
  if(k==='cat'){f.err='';rerenderForm(a,'amt-'+a)}
  if(k==='client'){showSug(a)}
  if(k==='trip'){const v=el.value.replace(/\D/g,'');if(v!==el.value){el.value=v;f.trip=v}}
  if(f.err&&(k==='amount'||k==='rate'||k==='client')){f.err='';$('#err-'+a).innerHTML=''}
 }
 if(root==='q'){S.ui.q[a]=el.value;const box=$('#dir-'+a);if(box){if(a==='clients')box.innerHTML=clientsList(clientMatches(),E(D().clients));else{const tmp=document.createElement('div');tmp.innerHTML=simpleDir(a);box.innerHTML=tmp.querySelector('#dir-'+a).innerHTML}}}
 if(root==='j'){S.ui.j[a]=el.value}
 save();
});
function showSug(t){
 const box=$('#sug-'+t),inp=$('#cl-'+t);if(!box||!inp)return;const v=inp.value.trim();const nm=$('#cln-'+t);
 const code=normCode(v);const exact=D().clients.find(c=>c.code===code);if(nm)nm.textContent=exact?exact.code+' · '+exact.name+(exact.disabled?' · отключён':''):'';
 if(!v||(exact&&exact.code===code&&document.activeElement!==inp)){box.hidden=true;return}
 const dg=v.replace(/\D/g,''), lo=v.toLowerCase();
 const m=D().clients.filter(c=>!c.disabled&&((dg&&c.code.replace(/\D/g,'').startsWith(dg))||c.name.toLowerCase().includes(lo))).slice(0,5);
 if(!m.length||(m.length===1&&m[0].code===code)){box.hidden=true;return}
 box.innerHTML=m.map(c=>`<button type="button" data-act="pickClient" data-t="${t}" data-v="${esc(c.code)}"><b>${esc(c.code)}</b><span>${esc(c.name)}</span></button>`).join('');box.hidden=false;
 if(S.ui.view==='phone'){const sc=inp.closest('.scroll');if(sc){const r=inp.getBoundingClientRect(),sr=sc.getBoundingClientRect();const want=(r.top-sr.top)/scaleNow()-110;if(want>0)sc.scrollBy({top:want,behavior:'smooth'})}}
}
document.addEventListener('focusout',e=>{if(e.target.id&&e.target.id.startsWith('cl-')){const t=e.target.id.slice(3);setTimeout(()=>{const b=$('#sug-'+t);if(b&&!b.contains(document.activeElement))b.hidden=true},150)}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();doLogin()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#dlg.in'))closeDlg();else if($('#ovl.in'))closeSheet();else if(S.ui.view==='phone')back()}
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('.form-card .inp')&&!e.target.matches('textarea')){const t=e.target.id.split('-')[1];if(t==='in'||t==='out'){e.preventDefault();submit(t)}}

function switchUser(id){S.ui.uid=id;S.ui.logged=true;if(S.ui.screen==='login')S.ui.screen='normal';const u=me();if(u.city!=='all')S.ui.city=u.city;S.ui.route={tab:tabs()[0],stack:[]};S.drafts=null;S.ui.forms={in:blankForm(),out:blankForm()};save();renderAll()}
function doLogin(){
 const l=($('#lgLogin').value||'').trim().toLowerCase(),p=$('#lgPass').value||'';S.ui.lgLogin=l;
 const btn=$('#lgBtn');btn.disabled=true;btn.textContent='Входим…';
 setTimeout(()=>{
  if(S.ui.conn==='offline'){S.ui.loginErr='Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'}
  else if(S.ui.fails>=4){S.ui.loginErr='Слишком много неудачных попыток. Подождите 2 минуты и попробуйте снова.'}
  else{const u=D().users.find(x=>x.login===l&&!x.disabled);if(u&&p==='kassa2026'){S.ui.loginErr='';S.ui.fails=0;switchUser(u.id);toast('Здравствуйте, '+u.name.split(' ')[0]);if(D().queue.length&&online())setTimeout(sendQueue,700);return}S.ui.fails++;S.ui.loginErr='Неверный логин или пароль.'}
  save();renderApp();
 },650);
}
function submit(t){
 const f=S.ui.forms[t],city=curCity(),cat=getCat(f.cat)||{f:{}};const cur=city==='and'?'USD':(f.cur||S.ui.lastCur);
 const err=m=>{TG.haptic('notification','error');f.err=m;$('#err-'+t).innerHTML=`<div class="alert err" role="alert">${ic('alert',18)}<div>${esc(m)}</div></div>`};
 let client='';
 if(cat.f.client){if(!f.client.trim())return err('Введите код клиента.');client=normCode(f.client);const c=D().clients.find(x=>x.code===client);if(!c)return err(`Клиента ${client} нет в справочнике. Проверьте код.`);if(c.disabled)return err(`Клиент ${client} отключён. Выберите другой код.`)}
 if(cat.f.trip&&!/^\d+$/.test(f.trip))return err('Введите номер рейса (только цифры).');
 if(cat.f.partner&&!f.partner)return err('Выберите контрагента.');
 if(cat.f.staff&&!f.staff)return err('Выберите сотрудника.');
 const amount=parseNum(f.amount);if(!(amount>0))return err('Введите сумму больше нуля, например 1500 или 1500,50.');
 let rate=null;if(cur==='RUB'){if(f.rate.trim()){rate=parseNum(f.rate);if(!(rate>0)||rate>500)return err('Введите курс: сколько рублей за 1 доллар, например 79 или 78,5.')}else if(t==='in')return err('Введите курс: сколько рублей за 1 доллар, например 79 или 78,5.')}
 const op={id:nid('op'),ts:Date.now(),city,type:t,cat:cat.id,cur,amount,rate,client,trip:cat.f.trip?f.trip:'',partner:cat.f.partner?f.partner:'',staff:cat.f.staff?f.staff:'',comment:f.comment.trim(),user:me().id,hist:[],edited:false,deleted:false};
 const dup=[...D().ops,...D().queue].find(o=>!o.deleted&&o.city===city&&o.type===t&&o.cat===op.cat&&o.cur===cur&&o.amount===amount&&op.ts-o.ts<3*6e4);
 if(dup)return confirmDlg({title:'Похожая запись уже есть',text:`${esc(Math.max(1,Math.round((op.ts-dup.ts)/6e4)))} мин назад внесли такую же запись: ${esc(catName(dup.cat))}, ${MT(amount,cur)}. Всё равно записать?`,ok:'Записать',onOk:()=>commitOp(t,op)});
 commitOp(t,op);
}
function commitOp(t,op){
 const f=S.ui.forms[t];S.ui.lastCur=op.cur;
 const desc=(op.type==='in'?`приход ${MT(op.amount,op.cur)}`:`${catName(op.cat)}, ${MT(op.amount,op.cur)}`)+(op.client?`, клиент ${op.client}`:'');
 const btn=$('#sub-'+t);if(btn){btn.disabled=true;btn.textContent='Записываем…'}
 const reset=()=>{const keep={cat:t==='out'?f.cat:null,cur:f.cur,rate:op.cur==='RUB'?f.rate:''};S.ui.forms[t]=Object.assign(blankForm(),keep,{msg:f.msg});};
 if(online()){
  setTimeout(()=>{D().ops.push(op);f.msg={kind:'ok',html:`<b>Записано:</b> ${esc(desc)}.`};reset();save();renderPage(null);const a=$('#amt-'+t);a&&a.focus({preventScroll:true});toast('Записано');TG.haptic('notification','success')},420);
 } else {
  op.status='pending';D().queue.push(op);f.msg={kind:'warn',html:`<b>Сохранено на телефоне, на сервер не ушло:</b> нет связи. ${esc(desc)}.`,qid:op.id};reset();S.ui.forms[t].msg=f.msg;save();renderPage(null);toast('Сохранено на телефоне','warn');TG.haptic('notification','warning');
  if(S.ui.conn==='reject')setTimeout(sendQueue,900);
 }
}
function sendQueue(){
 const q=D().queue;if(!q.length||S.ui.sending)return;S.ui.lastTry=Date.now();
 if(S.ui.conn==='offline'){renderQueue();toast('Нет связи. Попробуем позже','warn');return}
 S.ui.sending=true;renderQueue();
 setTimeout(()=>{
  S.ui.sending=false;let sent=0;
  if(S.ui.conn==='online'){q.forEach(o=>{if(o.status!=='rejected'){delete o.status;delete o.reason;D().ops.push(o);sent++;['in','out'].forEach(t=>{const m=S.ui.forms[t].msg;if(m&&m.qid===o.id)S.ui.forms[t].msg={kind:'ok',html:'<b>Записано.</b> Запись дошла до сервера и есть в журнале.'}})}});D().queue=q.filter(o=>o.status==='rejected')}
  else{q.forEach(o=>{if(o.status!=='rejected'){o.status='rejected';o.reason=o.client?`клиент ${o.client} не прошёл проверку`:'категория закрыта для этой кассы'}})}
  save();renderPage(null);
  if(sent)toast(`Отправлено записей: ${sent}`);else if(S.ui.conn==='reject')toast('Сервер не принял записи','err');
 },1100);
}

 catCity:el=>{S.ui.catCity=el.dataset.v;$$('[data-act=catCity]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===el.dataset.v))},
 catSw:el=>{const k=el.dataset.v;S.ui.catF[k]=S.ui.catF[k]?0:1;el.setAttribute('aria-checked',!!S.ui.catF[k])},
 catArch:el=>{const c=getCat(el.dataset.v);c.archived=!c.archived;save();closeSheet();renderPage(null);toast(c.archived?'Убрано в архив':'Возвращено из архива')},
 userEdit:el=>userSheet(el.dataset.v), userNew:()=>userSheet(),
 userToggle:el=>{const u=D().users.find(x=>x.id===el.dataset.v);u.disabled=!u.disabled;save();renderPage(null);renderProto();toast(u.disabled?'Отключён':'Включён')},
 userDel:el=>{const u=D().users.find(x=>x.id===el.dataset.v);if(D().ops.some(o=>o.user===u.id))return;confirmDlg({title:`Удалить: ${u.name}?`,text:'Этот человек ничего не вносил, поэтому его можно удалить полностью.',ok:'Удалить',danger:true,onOk:()=>{D().users=D().users.filter(x=>x.id!==u.id);save();closeSheet();renderPage(null);renderProto();toast('Удалено')}})},
 tabsCfg:()=>{S.drafts=null;push('tabsCfg')},
 tabAdd:el=>{const d=S.drafts;const i=d.indexOf(el.dataset.v);d.splice(i,1);d.splice(3,0,el.dataset.v);refreshTabCfg()},
 tabsDefault:()=>{const r=role();S.drafts=[...new Set([...DEF_TABS[r],...secs()])].filter(s=>allowed(s)&&s!=='settings');refreshTabCfg();toast('Порядок по умолчанию')},
 tabsSave:()=>{S.ui.tabs[role()]=S.drafts.slice(0,4);save();renderTabbar();back();toast('Панель сохранена')},
 theme:el=>{S.ui.themeManual=true;S.ui.theme=el.dataset.v;save();document.documentElement.dataset.theme=S.ui.theme;renderProto();renderPage(null);tgChrome()},
 themeToggle:()=>{closeSheet();S.ui.themeManual=true;S.ui.theme=S.ui.theme==='dark'?'light':'dark';save();document.documentElement.dataset.theme=S.ui.theme;renderProto();renderPage(null)},
 city:el=>{if(!isAll())return;closeSheet();S.ui.city=el.dataset.v;['in','out'].forEach(k=>{S.ui.forms[k].cat=null;S.ui.forms[k].err=''});save();renderProto();renderPage(null);toast('Запись в кассу: '+CITY[S.ui.city])},
 cityPick:()=>openSheet({title:'Касса для записи',body:`<div class="list flat">${['msk','and'].map(c=>`<button class="row" data-act="city" data-v="${c}"><span class="av">${CITY_S[c]}</span><span class="rb"><span class="rt">${CITY[c]}</span><span class="rs">${c==='and'?'Только доллары':'Рубли и доллары'} · остаток ${curs(c).map(cu=>MT(bal(c,cu),cu)).join(', ')}</span></span>${c===curCity()?`<span class="icon-btn" style="background:var(--accent);color:var(--on-accent)">${ic('check',16,2.4)}</span>`:''}</button>`).join('')}</div>`}),
 scope:el=>{if(!isAll())return;S.ui.scope=el.dataset.v;if(el.dataset.v!=='both')S.ui.city=el.dataset.v;S.ui.j.limit=40;save();renderProto();renderPage(null)},
 conn:el=>{const prev=S.ui.conn;S.ui.conn=el.dataset.v;save();renderProto();renderPage(null);if(S.ui.conn==='online'&&prev!=='online'&&D().queue.length){toast('Связь есть. Отправляем…');setTimeout(sendQueue,600)}},
 pView:el=>{S.ui.view=el.dataset.v;S.ui.route.stack=[];save();renderAll()},
 tgLink:()=>{S.ui.tg=!S.ui.tg;save();renderPage(null);toast(S.ui.tg?'Telegram привязан':'Telegram отвязан')},
 lang:()=>toast('Язык интерфейса: русский'),
 logout:()=>{const n=D().queue.length;const out=()=>{S.ui.logged=false;S.ui.loginErr='';save();renderApp()};if(n)confirmDlg({title:`Не отправлено: ${n}`,text:'Если выйти, записи останутся на этом телефоне и уйдут при следующем входе.',ok:'Всё равно выйти',cancel:'Остаться',danger:true,onOk:out});else confirmDlg({title:'Выйти?',text:'В следующий раз понадобятся логин и пароль.',ok:'Выйти',onOk:out})},
 qSend:()=>sendQueue(), qToggle:()=>{S.ui.qOpen=!S.ui.qOpen;renderQueue()},
 qRetry:el=>{const o=D().queue.find(x=>x.id===el.dataset.id);if(o){o.status='pending';delete o.reason}sendQueue()},
 qDel:el=>confirmDlg({title:'Удалить с телефона?',text:'Эта запись не дошла до сервера. После удаления её не вернуть.',ok:'Удалить',danger:true,onOk:()=>{D().queue=D().queue.filter(x=>x.id!==el.dataset.id);save();renderPage(null);toast('Удалено')}}),
 reset:()=>confirmDlg({title:'Сбросить к началу?',text:'Все изменения в прототипе пропадут, тестовые данные создадутся заново.',ok:'Сбросить',danger:true,onOk:()=>{try{localStorage.removeItem(KEY)}catch(e){}const v=S.ui.view,t=S.ui.theme;S.data=seed();S.ui=defaultUI();S.ui.view=v;S.ui.theme=t;S.drafts=null;save();renderAll();toast('Данные сброшены')}}),
 saOv:()=>{S.ui.saOv=!S.ui.saOv;save();renderProto();renderApp()},
 protoOpen:()=>$('#proto').classList.add('open'), protoClose:()=>$('#proto').classList.remove('open'),
 sideOpen:()=>$('#app').classList.add('side-open'), sideClose:()=>closeSide()
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const a=t.dataset.act;
 if(a.startsWith('cur-')){const k=a.slice(4);const f=S.ui.forms[k];f.cur=t.dataset.v;S.ui.lastCur=t.dataset.v;if(t.dataset.v==='RUB'&&k==='in'&&!f.rate)f.rate=lastRateToday(curCity());rerenderForm(k,'amt-'+k);save();return}
 if(ACT[a]){e.preventDefault();ACT[a](t,e)}
});

/* ---------- запуск ---------- */
load();
const u0=me();if(u0.city!=='all')S.ui.city=u0.city;
if(TG.real){
 if(!S.ui.themeManual&&TG.theme&&TG.theme.bg_color){const h=TG.theme.bg_color.replace('#','');const L=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000;S.ui.theme=L<128?'dark':'light'}
 const setSafe=(k,d)=>{TG.st[k]={top:+d.top||0,bottom:+d.bottom||0,left:+d.left||0,right:+d.right||0};TG.st.got=true;tgApply()};
 TG.on('safe_area_changed',d=>setSafe('safe',d));
 TG.on('content_safe_area_changed',d=>setSafe('content',d));
 TG.on('fullscreen_changed',d=>{TG.st.full=!!d.is_fullscreen;TG.st.got=true;tgApply()});
 TG.on('fullscreen_failed',()=>{TG.st.full=false;TG.st.got=true;tgApply()});
 TG.on('back_button_pressed',()=>{if(!back())TG.post('web_app_setup_back_button',{is_visible:false})});
 TG.on('settings_button_pressed',()=>{S.ui.route.stack=[];go('settings')});
 TG.on('theme_changed',d=>{if(S.ui.themeManual)return;const bg=d&&d.theme_params&&d.theme_params.bg_color;if(!bg)return;const h=bg.replace('#','');const L=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000;S.ui.theme=L<128?'dark':'light';document.documentElement.dataset.theme=S.ui.theme;renderPage(null)});
}
renderAll();
if(TG.real){
 TG.post('web_app_ready');TG.post('web_app_expand');
 TG.post('web_app_request_fullscreen');
 TG.post('web_app_setup_swipe_behavior',{allow_vertical_swipe:false});
 TG.post('web_app_toggle_orientation_lock',{locked:true});
 TG.post('web_app_setup_settings_button',{is_visible:true});
 TG.post('web_app_request_safe_area');TG.post('web_app_request_content_safe_area');
 tgChrome();
}
addEventListener('resize',()=>{const bare=S.ui.view==='phone'&&(TG.real||innerWidth<600);const isBare=!!$('.screen.bare');if(S.ui.view==='phone'&&bare!==isBare)renderStage();else{fitDevice();placeLens(tabs().indexOf(S.ui.route.tab))}});
setInterval(tick,20000);
})();
</script>
